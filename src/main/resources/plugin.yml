name: DiscordVerificator
version: '${version}'
main: net.justempire.discordverificator.DiscordVerificatorPlugin
api-version: '1.20.6'
authors: ['mrquackduck', 'Andromedov']

commands:
  link:
    description: Link player to Discord profile
    usage: link <Player> <Discord Id>
  unlink:
    description: Unlink player from Discord
    usage: unlink <Player>
  relink:
    description: Relink an existing player to a new username
    usage: relink <Old Player Name> <New Player Name>
  dvreload:
    description: Reload the plugin
  dvinfo:
    description: Check player info
    usage: dvinfo <Player>
  dvdecision:
    description: Internal command for handling alerts
    usage: dvdecision <allow|block|unblock> <discordId>
  dvconfirm:
    description: Console-only emergency confirmation of a recent player IP
    usage: dvconfirm <Player> | dvconfirm revoke <Player>

permissions:
  discordVerificator.link:
    description: Allows to link player to Discord profile
    default: op
  discordVerificator.unlink:
    description: Allows to unlink player from Discord profile
    default: op
  discordVerificator.relink:
    description: Allows to relink player to a new username
    default: op
  discordVerificator.reload:
    description: Allows to reload the plugin
    default: op
  discordVerificator.info:
    description: Allows to check info
    default: op
  discordVerificator.alerts:
    description: Allows to handle alerts
    default: op
