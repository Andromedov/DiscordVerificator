# 1. Create a Discord bot on the Discord Developer Portal: https://discord.com/developers/applications
# 2. Get the token from the "Bot" tab
# 3. Insert the token below
# 4. Run the "/dvreload" command or reload the server
# 5. Give your players access to send a command to the bot (e.g., invite it to your Discord server)
token: "DISCORD_BOT_TOKEN"

# Language configuration. Available files in the lang folder: en, ua
language: en

# Maximum number of distinct linked Discord accounts that may share one IP address.
# Minimum: 1. /dvdecision allow <discordId | playerName> grants that Discord account a full
# shared-IP bypass; it does not set a separate numeric limit. /dvdecision block still takes priority.
default-max-accounts-per-ip: 1

# The ID of your Discord server (guild). If a player isn't on the server, they won't be allowed in.
# Leave this field blank ("") to disable this check.
required-guild-id: ""

# A link to the Discord server invitation that will be displayed to the player if they are not on the server.
discord-invite-link: "https://discord.gg/yourinvite"

# If configured, multi-account alerts will be sent directly to your Discord staff channel
discord-alerts:
  channel-id: "" # E.g., "123456789012345678"
  admin-role-id: "" # The role ID required to click "Allow" / "Block" buttons

# If enabled (default), players must confirm their IP address via the "/confirm" Discord command
# whenever their IP changes, before they're allowed to join.
# If disabled, this step is skipped entirely — players will only need to:
#   - be a linked account,
#   - be present on the required Discord server (if configured),
#   - pass the multi-account/shared-IP check.
require-ip-verification: true

# Verification codes are single-use and only the latest code issued for a Minecraft account remains valid.
# Allowed length: 2-16 characters. Values outside this range are clamped.
# Five characters are convenient for private servers; 8 or more are recommended for stronger protection.
# Allowed range: 30-3600 seconds. Values outside this range are clamped.
verification-code:
  length: 5
  expiration-seconds: 300

# Privacy controls for IP addresses processed by the plugin.
privacy:
  # Recommended: mask IP addresses in /dvinfo, in-game staff alerts, and Discord staff alerts.
  mask-ip-addresses-in-staff-messages: true
  # Historical IP and verification cooldown records older than this are deleted automatically.
  # The currently allowed IP remains stored while the Discord account is linked because it is
  # required for IP-change verification. Allowed range: 1-3650 days.
  ip-history-retention-days: 30
